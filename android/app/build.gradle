apply plugin: 'com.android.application'

/* ==========================================================================
   BâtiPlus — module Android (étape 13)
   Signature de la version Play Store : la clé (keystore) n'est JAMAIS dans le dépôt.
   Elle est lue, dans cet ordre :
     1. android/keystore.properties (ignoré par Git — modèle : keystore.properties.exemple) ;
     2. variables d'environnement BATIPLUS_KEYSTORE, BATIPLUS_KEYSTORE_MOT_DE_PASSE,
        BATIPLUS_CLE_ALIAS, BATIPLUS_CLE_MOT_DE_PASSE (intégration continue).
   Sans clé, la version de test (assembleDebug) se construit quand même ; la version
   publiée (bundleRelease) s'arrête avec un message clair.
   ========================================================================== */
def proprietesSignature = new Properties()
def fichierSignature = rootProject.file('keystore.properties')
if (fichierSignature.exists()) {
    fichierSignature.withInputStream { proprietesSignature.load(it) }
}
def valeurSignature = { String cle, String variable ->
    def valeur = proprietesSignature.getProperty(cle) ?: System.getenv(variable)
    return valeur ? valeur.trim() : null
}
def cheminKeystore = valeurSignature('storeFile', 'BATIPLUS_KEYSTORE')
def signatureDisponible = cheminKeystore != null && rootProject.file(cheminKeystore).exists()

android {
    namespace "com.brgelectro.batiplus"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.brgelectro.batiplus"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        /* À CHAQUE mise à jour sur le Play Store : versionCode + 1 (entier), versionName lisible. */
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        /* Langue de l'application : le français seulement (ressources des bibliothèques allégées). */
        resourceConfigurations += ["fr"]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (signatureDisponible) {
                storeFile rootProject.file(cheminKeystore)
                storePassword valeurSignature('storePassword', 'BATIPLUS_KEYSTORE_MOT_DE_PASSE')
                keyAlias valeurSignature('keyAlias', 'BATIPLUS_CLE_ALIAS') ?: 'batiplus'
                keyPassword valeurSignature('keyPassword', 'BATIPLUS_CLE_MOT_DE_PASSE')
            }
        }
    }
    buildTypes {
        debug {
            /* Version de test : installable à côté de la version Play Store. */
            applicationIdSuffix ".test"
            versionNameSuffix "-test"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signatureDisponible) {
                signingConfig signingConfigs.release
            }
        }
    }
}

/* La version publiée n'est jamais produite sans signature. */
gradle.taskGraph.whenReady { graphe ->
    def publication = graphe.allTasks.any { it.name ==~ /(bundle|assemble|package)Release/ }
    if (publication && !signatureDisponible) {
        throw new GradleException("BâtiPlus : clé de signature introuvable. Créez android/keystore.properties " +
            "(modèle : android/keystore.properties.exemple) ou les variables BATIPLUS_KEYSTORE… — voir ANDROID.md, étape 5.")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
